name: Release (dytes)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.meta.outputs.platforms }}
      build: ${{ steps.meta.outputs.build }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./dytes.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} 与 dytes.json 版本 ${version} 不一致" >&2
            exit 1
          fi
          platforms=$(node -e "const d=require('./dytes.json');const p=Object.keys(d['platform-exports']||{});process.stdout.write(JSON.stringify(p.length?p:['windows']))")
          if [ -f CMakeLists.txt ]; then
            build=cmake
          elif [ -f Cargo.toml ]; then
            build=cargo
          else
            build=deno
          fi
          echo "platforms=${platforms}" >> "$GITHUB_OUTPUT"
          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        if: needs.prepare.outputs.build == 'cargo'
        uses: dtolnay/rust-toolchain@stable

      - name: Install CMake dependencies (Windows)
        if: needs.prepare.outputs.build == 'cmake' && matrix.platform == 'windows'
        shell: pwsh
        run: choco install -y cmake ninja

      - name: Install CMake dependencies (Unix)
        if: needs.prepare.outputs.build == 'cmake' && matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" = "linux" ]; then
            sudo apt-get update
            sudo apt-get install -y cmake ninja-build pkg-config
          else
            brew install cmake ninja pkg-config
          fi

      - name: Build (cargo)
        if: needs.prepare.outputs.build == 'cargo'
        shell: bash
        run: cargo build --release

      - name: Build (cmake)
        if: needs.prepare.outputs.build == 'cmake'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DBUILD_TESTS=OFF
          cmake --build build --config Release

      - name: Publish with dytes
        shell: bash
        env:
          DYTES_VERSION: v0.2.1
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Windows) asset="dytes-windows.exe"; bin="dytes.exe" ;;
            Linux)   asset="dytes-linux";      bin="dytes" ;;
            macOS)   asset="dytes-macos";      bin="dytes" ;;
            *) echo "::error::unsupported runner: ${RUNNER_OS}"; exit 1 ;;
          esac
          bin_dir="${RUNNER_TEMP}/dytes-bin"
          mkdir -p "${bin_dir}"
          # 走 API 下载资产：release 的 github.com/download 直链在 runner 上返回 404
          meta=$(curl -fsSL "https://api.github.com/repos/dytescn/dytes/releases/tags/${DYTES_VERSION}")
          asset_id=$(printf '%s' "${meta}" | tr -d '\n ' \
            | grep -o "\"id\":[0-9]*,\"node_id\":\"[^\"]*\",\"name\":\"${asset}\"" \
            | head -1 | sed 's/.*"id":\([0-9]*\),.*/\1/')
          if [ -z "${asset_id}" ]; then
            echo "::error::未在 ${DYTES_VERSION} 找到资产 ${asset}"
            exit 1
          fi
          curl -fsSL -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/dytescn/dytes/releases/assets/${asset_id}" \
            -o "${bin_dir}/${bin}"
          chmod +x "${bin_dir}/${bin}" 2>/dev/null || true
          "${bin_dir}/${bin}" --version
          "${bin_dir}/${bin}" publish
