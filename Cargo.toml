[package]
name = "chatllm"
version = "1.0.15"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "chatllm"        # 输出库名：librust_lib.so / rust_lib.dll

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_json = "1.0"
anyhow = "1.0.102"
uuid = { version = "1", features = ["v4"] }
libloading = "0.8"
