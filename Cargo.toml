[package]
name = "chatllm"
version = "1.0.1"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "chatllm"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_json = "1.0"
anyhow = "1.0.102"
uuid = { version = "1", features = ["v4"] }
libloading = "0.8"
turbovec = "1.1.2"
llama-cpp-2 = "0.1.160"


